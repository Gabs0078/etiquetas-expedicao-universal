name: Bug report
description: Report unexpected behavior using fictitious data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior. Do not attach real invoices or credentials.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, OS, browser and interface language
  - type: textarea
    id: example
    attributes:
      label: Fictitious example or screenshot
      description: Remove personal/company information and access codes before sharing.
